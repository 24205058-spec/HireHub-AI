version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: hirehub-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: hirehub_ai
    volumes:
      - mongodb_data:/data/db
    networks:
      - hirehub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hirehub-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/hirehub_ai
      JWT_SECRET: hirehub_super_secret_jwt_key_change_in_production
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - hirehub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hirehub-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - hirehub-network

volumes:
  mongodb_data:
    driver: local

networks:
  hirehub-network:
    driver: bridge
